  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="52" y="56" fill="#59636E" font-size="14" font-weight="700" letter-spacing="1.8">ENGINEERING FLIGHT RECORDER / FELMONON / 2026.08</text>
    <path d="M52 76H1148" stroke="#8C867B" stroke-width="1"/>
    <text x="52" y="123" fill="#1F2328" font-size="18" font-weight="700" letter-spacing="3">FELMON FEKADU</text>
    <text x="52" y="194" fill="#1F2328" font-size="48" font-weight="800" letter-spacing="-1.8">I BUILD SOFTWARE</text>
    <text x="52" y="250" fill="#116329" font-size="48" font-weight="800" letter-spacing="-1.8">THAT LEAVES EVIDENCE.</text>
    <text x="52" y="305" fill="#1F2328" font-size="17">Developer tools and AI reliability systems</text>
    <text x="52" y="333" fill="#59636E" font-size="17">that expose hidden behavior, enforce deterministic</text>
    <text x="52" y="361" fill="#59636E" font-size="17">gates, and make regressions impossible to ignore.</text>
    <g transform="translate(52 390)">
      <rect width="95" height="32" fill="#FCFBF7" stroke="#8C867B"/>
      <text x="14" y="21" fill="#1F2328" font-size="13" font-weight="700" letter-spacing="0.7">DEVTOOLS</text>
    </g>
<g transform="translate(159 390)">
      <rect width="169" height="32" fill="#DDF3E4" stroke="#116329"/>
      <text x="14" y="21" fill="#116329" font-size="13" font-weight="700" letter-spacing="0.7">AGENT RELIABILITY</text>
    </g>
<g transform="translate(340 390)">
      <rect width="186" height="32" fill="#FCFBF7" stroke="#8C867B"/>
      <text x="14" y="21" fill="#1F2328" font-size="13" font-weight="700" letter-spacing="0.7">PRODUCT ENGINEERING</text>
    </g>

    <path d="M718 96V434" stroke="#8C867B" stroke-dasharray="4 7"/>
    <text x="758" y="119" fill="#116329" font-size="14" font-weight="700" letter-spacing="1.8">SIGNAL ACQUIRED</text>
    <text x="1148" y="119" fill="#59636E" font-size="12" text-anchor="end">TRACE / ACTIVE</text>
    <path d="M770 178H1070" stroke="#8C867B" stroke-width="2"/>
    <circle cx="770" cy="178" r="9" fill="#FCFBF7" stroke="#8C867B" stroke-width="2"/>
<circle cx="870" cy="178" r="9" fill="#FCFBF7" stroke="#8C867B" stroke-width="2"/>
<circle cx="970" cy="178" r="9" fill="#DDF3E4" stroke="#116329" stroke-width="2"/>
<circle cx="1070" cy="178" r="9" fill="#FCFBF7" stroke="#8C867B" stroke-width="2"/>
    <circle class="signal-pulse" cx="770" cy="178" r="5" fill="#116329"/>
    <text x="770" y="215" fill="#1F2328" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.8">INPUT</text>
<text x="870" y="215" fill="#1F2328" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.8">OBSERVE</text>
<text x="970" y="215" fill="#116329" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.8">VERIFY</text>
<text x="1070" y="215" fill="#1F2328" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.8">SHIP</text>

    <path class="policy-gate" d="M970 187V271H1114" fill="none" stroke="#9A4D00" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="948" y="257" width="200" height="42" fill="#FDE8C4" stroke="#9A4D00"/>
    <text x="1048" y="283" fill="#9A4D00" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1.2">REGRESSION / BLOCKED</text>

    <text x="758" y="337" fill="#59636E" font-size="12" letter-spacing="1.4">POLICY GATE / EVIDENCE ATTACHED</text>
    <text x="758" y="371" fill="#116329" font-size="14" font-weight="700">[PASS]</text>
    <text x="824" y="371" fill="#1F2328" font-size="14">schema contract</text>
    <text x="758" y="399" fill="#116329" font-size="14" font-weight="700">[PASS]</text>
    <text x="824" y="399" fill="#1F2328" font-size="14">latency + cost budget</text>
    <text x="758" y="427" fill="#9A4D00" font-size="14" font-weight="700">[STOP]</text>
    <text x="824" y="427" fill="#1F2328" font-size="14">baseline delta</text>
