  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="52" y="58" fill="#1F2328" font-size="16" font-weight="800" letter-spacing="1.5">ONE RECORDED TRACE</text>
    <text x="1148" y="58" fill="#59636E" font-size="12" text-anchor="end">00:00—00:05 / REPRODUCIBLE</text>
    <path d="M84 143H1114" stroke="#8C867B" stroke-width="2"/>
    <circle class="signal-pulse" cx="84" cy="143" r="5" fill="#116329"/>
    <g>
        <text x="84" y="101" fill="#59636E" font-size="12" text-anchor="middle">00:00</text>
        <circle cx="84" cy="143" r="10" fill="#FCFBF7" stroke="#8C867B" stroke-width="2"/>
        <text x="84" y="190" fill="#8C867B" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="0.8">INPUT</text>
        <text x="84" y="222" fill="#1F2328" font-size="12" text-anchor="middle">ambiguous behavior</text>
      </g>
<g>
        <text x="290" y="101" fill="#59636E" font-size="12" text-anchor="middle">00:01</text>
        <circle cx="290" cy="143" r="10" fill="#DDF3E4" stroke="#116329" stroke-width="2"/>
        <text x="290" y="190" fill="#116329" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="0.8">OBSERVE</text>
        <text x="290" y="222" fill="#1F2328" font-size="12" text-anchor="middle">import the trace</text>
      </g>
<g>
        <text x="496" y="101" fill="#59636E" font-size="12" text-anchor="middle">00:02</text>
        <circle cx="496" cy="143" r="10" fill="#DDF3E4" stroke="#116329" stroke-width="2"/>
        <text x="496" y="190" fill="#116329" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="0.8">VERIFY</text>
        <text x="496" y="222" fill="#1F2328" font-size="12" text-anchor="middle">schema · budget · safety</text>
      </g>
<g>
        <text x="702" y="101" fill="#59636E" font-size="12" text-anchor="middle">00:03</text>
        <circle cx="702" cy="143" r="10" fill="#DDF3E4" stroke="#116329" stroke-width="2"/>
        <text x="702" y="190" fill="#116329" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="0.8">COMPARE</text>
        <text x="702" y="222" fill="#1F2328" font-size="12" text-anchor="middle">candidate ↔ baseline</text>
      </g>
<g>
        <text x="908" y="101" fill="#59636E" font-size="12" text-anchor="middle">00:04</text>
        <circle cx="908" cy="143" r="10" fill="#FDE8C4" stroke="#9A4D00" stroke-width="2"/>
        <text x="908" y="190" fill="#9A4D00" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="0.8">DECISION</text>
        <text x="908" y="222" fill="#1F2328" font-size="12" text-anchor="middle">regression blocked</text>
      </g>
<g>
        <text x="1114" y="101" fill="#59636E" font-size="12" text-anchor="middle">00:05</text>
        <circle cx="1114" cy="143" r="10" fill="#DDF3E4" stroke="#116329" stroke-width="2"/>
        <text x="1114" y="190" fill="#116329" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="0.8">ARTIFACT</text>
        <text x="1114" y="222" fill="#1F2328" font-size="12" text-anchor="middle">reproducible report</text>
      </g>
    <path class="policy-gate" d="M908 154V254" stroke="#9A4D00" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="908" y="280" fill="#9A4D00" font-size="12" font-weight="700" text-anchor="middle">POLICY GATE FIRED</text>
    <text x="52" y="280" fill="#59636E" font-size="12">A TRACE EXPLAINS WHY THE SYSTEM WILL KEEP WORKING.</text>
