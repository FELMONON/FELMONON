<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">One recorded AI agent trace</title>
  <desc id="desc">A six-step timeline imports ambiguous behavior, verifies it, compares it to a baseline, blocks a regression, and emits a reproducible report.</desc>
  <style>
    @keyframes signal-travel {
      0%, 12% { transform: translateX(0); opacity: 0; }
      20% { opacity: 1; }
      72% { transform: translateX(1030px); opacity: 1; }
      86%, 100% { transform: translateX(1030px); opacity: 0; }
    }
    @keyframes gate-breathe {
      0%, 100% { opacity: 0.72; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .signal-pulse { animation: signal-travel 5.2s cubic-bezier(.4,0,.2,1) infinite; }
      .policy-gate { animation: gate-breathe 2.6s ease-in-out infinite; }
    }
  </style>
