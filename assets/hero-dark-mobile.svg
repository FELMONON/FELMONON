<svg xmlns="http://www.w3.org/2000/svg" width="360" height="620" viewBox="0 0 360 620" role="img" aria-labelledby="title desc">
  <title id="title">Felmon Fekadu engineering flight recorder</title>
  <desc id="desc">I build software that leaves evidence. A mobile flight-recorder diagram shows a signal moving through input, observation, verification, and shipping while a policy gate blocks a regression.</desc>
  <style>
    @keyframes signal-travel {
      0%, 12% { transform: translateX(0); opacity: 0; }
      20% { opacity: 1; }
      72% { transform: translateX(292px); opacity: 1; }
      86%, 100% { transform: translateX(292px); opacity: 0; }
    }
    @keyframes gate-breathe {
      0%, 100% { opacity: 0.72; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .signal-pulse { animation: signal-travel 5.2s cubic-bezier(.4,0,.2,1) infinite; }
      .policy-gate { animation: gate-breathe 2.6s ease-in-out infinite; }
    }
  </style>
  <rect width="360" height="620" fill="#0B0F14"/>
  <path d="M45 0V620" stroke="#27313C" stroke-width="1" opacity="0.28"/>
<path d="M90 0V620" stroke="#27313C" stroke-width="1" opacity="0.28"/>
<path d="M135 0V620" stroke="#27313C" stroke-width="1" opacity="0.28"/>
<path d="M180 0V620" stroke="#27313C" stroke-width="1" opacity="0.28"/>
<path d="M225 0V620" stroke="#27313C" stroke-width="1" opacity="0.28"/>
<path d="M270 0V620" stroke="#27313C" stroke-width="1" opacity="0.28"/>
<path d="M315 0V620" stroke="#27313C" stroke-width="1" opacity="0.28"/>
<path d="M0 45H360" stroke="#27313C" stroke-width="1" opacity="0.28"/>
<path d="M0 90H360" stroke="#27313C" stroke-width="1" opacity="0.28"/>
