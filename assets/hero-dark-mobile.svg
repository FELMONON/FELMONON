<path d="M0 180H360" stroke="#27313C" stroke-width="1" opacity="0.28"/>
<path d="M0 225H360" stroke="#27313C" stroke-width="1" opacity="0.28"/>
<path d="M0 270H360" stroke="#27313C" stroke-width="1" opacity="0.28"/>
<path d="M0 315H360" stroke="#27313C" stroke-width="1" opacity="0.28"/>
<path d="M0 360H360" stroke="#27313C" stroke-width="1" opacity="0.28"/>
<path d="M0 405H360" stroke="#27313C" stroke-width="1" opacity="0.28"/>
<path d="M0 450H360" stroke="#27313C" stroke-width="1" opacity="0.28"/>
<path d="M0 495H360" stroke="#27313C" stroke-width="1" opacity="0.28"/>
<path d="M0 540H360" stroke="#27313C" stroke-width="1" opacity="0.28"/>
<path d="M0 585H360" stroke="#27313C" stroke-width="1" opacity="0.28"/>
  <rect x="6" y="6" width="348" height="608" fill="none" stroke="#59636E"/>
  <path d="M30 6v5" stroke="#59636E" stroke-width="1"/>
<path d="M60 6v5" stroke="#59636E" stroke-width="1"/>
<path d="M90 6v5" stroke="#59636E" stroke-width="1"/>
<path d="M120 6v10" stroke="#59636E" stroke-width="1"/>
<path d="M150 6v5" stroke="#59636E" stroke-width="1"/>
<path d="M180 6v5" stroke="#59636E" stroke-width="1"/>
<path d="M210 6v5" stroke="#59636E" stroke-width="1"/>
<path d="M240 6v10" stroke="#59636E" stroke-width="1"/>
<path d="M270 6v5" stroke="#59636E" stroke-width="1"/>
<path d="M300 6v5" stroke="#59636E" stroke-width="1"/>
<path d="M330 6v5" stroke="#59636E" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="24" y="33" fill="#9DA7B3" font-size="10" font-weight="700" letter-spacing="0.7">FLIGHT RECORDER / FELMONON / 2026.08</text>
    <path d="M24 49H336" stroke="#59636E"/>
    <text x="24" y="76" fill="#F0F6FC" font-size="11" font-weight="700" letter-spacing="1.4">FELMON FEKADU</text>
    <text x="24" y="112" fill="#F0F6FC" font-size="24" font-weight="800" letter-spacing="-0.9">I BUILD SOFTWARE</text>
    <text x="24" y="142" fill="#3FB950" font-size="24" font-weight="800" letter-spacing="-0.9">THAT LEAVES EVIDENCE.</text>
    <text x="24" y="181" fill="#F0F6FC" font-size="13">Developer tools + AI reliability</text>
    <text x="24" y="203" fill="#9DA7B3" font-size="13">systems that expose hidden behavior,</text>
    <text x="24" y="225" fill="#9DA7B3" font-size="13">enforce deterministic gates, and make</text>
    <text x="24" y="247" fill="#9DA7B3" font-size="13">regressions impossible to ignore.</text>
    <text x="24" y="281" fill="#3FB950" font-size="10" font-weight="700" letter-spacing="0.7">DEVTOOLS / AGENT RELIABILITY / PRODUCT ENGINEERING</text>

    <path d="M24 306H336" stroke="#59636E" stroke-dasharray="3 5"/>
    <text x="24" y="333" fill="#3FB950" font-size="10" font-weight="700" letter-spacing="0.9">SIGNAL ACQUIRED</text>
    <text x="336" y="333" fill="#9DA7B3" font-size="10" text-anchor="end">TRACE / ACTIVE</text>
    <path d="M34 385H326" stroke="#59636E" stroke-width="2"/>
    <circle cx="34" cy="385" r="6" fill="#111820" stroke="#59636E" stroke-width="2"/>
<circle cx="132" cy="385" r="6" fill="#111820" stroke="#59636E" stroke-width="2"/>
<circle cx="230" cy="385" r="6" fill="#132A1C" stroke="#3FB950" stroke-width="2"/>
<circle cx="326" cy="385" r="6" fill="#111820" stroke="#59636E" stroke-width="2"/>
    <circle class="signal-pulse" cx="34" cy="385" r="3.5" fill="#3FB950"/>
    <text x="34" y="416" fill="#F0F6FC" font-size="10" font-weight="700" text-anchor="middle">INPUT</text>
<text x="132" y="416" fill="#F0F6FC" font-size="10" font-weight="700" text-anchor="middle">OBSERVE</text>
<text x="230" y="416" fill="#3FB950" font-size="10" font-weight="700" text-anchor="middle">VERIFY</text>
<text x="326" y="416" fill="#F0F6FC" font-size="10" font-weight="700" text-anchor="middle">SHIP</text>

    <path class="policy-gate" d="M230 392V466H336" fill="none" stroke="#E3A22B" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="205" y="451" width="131" height="32" fill="#34250B" stroke="#E3A22B"/>
    <text x="270.5" y="471" fill="#E3A22B" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="0.4">REGRESSION / BLOCKED</text>

    <text x="24" y="522" fill="#9DA7B3" font-size="10" letter-spacing="0.7">POLICY GATE / EVIDENCE ATTACHED</text>
    <text x="24" y="555" fill="#3FB950" font-size="11" font-weight="700">[PASS]</text>
    <text x="73" y="555" fill="#F0F6FC" font-size="11">schema · budget · grounding</text>
    <text x="24" y="585" fill="#E3A22B" font-size="11" font-weight="700">[STOP]</text>
    <text x="73" y="585" fill="#F0F6FC" font-size="11">baseline delta</text>
  </g>
</svg>
