<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" role="img" aria-labelledby="title desc">
  <title id="title">One recorded AI agent trace</title>
  <desc id="desc">A vertical six-step mobile timeline imports ambiguous behavior, verifies it, compares it to a baseline, blocks a regression, and emits a reproducible report.</desc>
  <style>
    @keyframes signal-travel {
      0%, 12% { transform: translateY(0); opacity: 0; }
      20% { opacity: 1; }
      72% { transform: translateY(430px); opacity: 1; }
      86%, 100% { transform: translateY(430px); opacity: 0; }
    }
    @keyframes gate-breathe {
      0%, 100% { opacity: 0.72; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .signal-pulse { animation: signal-travel 5.2s cubic-bezier(.4,0,.2,1) infinite; }
      .policy-gate { animation: gate-breathe 2.6s ease-in-out infinite; }
    }
  </style>
  <rect width="360" height="640" fill="#F7F4EC"/>
  <path d="M45 0V640" stroke="#D7D1C5" stroke-width="1" opacity="0.28"/>
<path d="M90 0V640" stroke="#D7D1C5" stroke-width="1" opacity="0.28"/>
<path d="M135 0V640" stroke="#D7D1C5" stroke-width="1" opacity="0.28"/>
<path d="M180 0V640" stroke="#D7D1C5" stroke-width="1" opacity="0.28"/>
<path d="M225 0V640" stroke="#D7D1C5" stroke-width="1" opacity="0.28"/>
<path d="M270 0V640" stroke="#D7D1C5" stroke-width="1" opacity="0.28"/>
<path d="M315 0V640" stroke="#D7D1C5" stroke-width="1" opacity="0.28"/>
<path d="M0 45H360" stroke="#D7D1C5" stroke-width="1" opacity="0.28"/>
<path d="M0 90H360" stroke="#D7D1C5" stroke-width="1" opacity="0.28"/>
<path d="M0 135H360" stroke="#D7D1C5" stroke-width="1" opacity="0.28"/>
<path d="M0 180H360" stroke="#D7D1C5" stroke-width="1" opacity="0.28"/>
<path d="M0 225H360" stroke="#D7D1C5" stroke-width="1" opacity="0.28"/>
<path d="M0 270H360" stroke="#D7D1C5" stroke-width="1" opacity="0.28"/>
<path d="M0 315H360" stroke="#D7D1C5" stroke-width="1" opacity="0.28"/>
<path d="M0 360H360" stroke="#D7D1C5" stroke-width="1" opacity="0.28"/>
<path d="M0 405H360" stroke="#D7D1C5" stroke-width="1" opacity="0.28"/>
<path d="M0 450H360" stroke="#D7D1C5" stroke-width="1" opacity="0.28"/>
<path d="M0 495H360" stroke="#D7D1C5" stroke-width="1" opacity="0.28"/>
<path d="M0 540H360" stroke="#D7D1C5" stroke-width="1" opacity="0.28"/>
<path d="M0 585H360" stroke="#D7D1C5" stroke-width="1" opacity="0.28"/>
<path d="M0 630H360" stroke="#D7D1C5" stroke-width="1" opacity="0.28"/>
  <rect x="6" y="6" width="348" height="628" fill="none" stroke="#8C867B"/>
  <path d="M30 6v5" stroke="#8C867B" stroke-width="1"/>
<path d="M60 6v5" stroke="#8C867B" stroke-width="1"/>
<path d="M90 6v5" stroke="#8C867B" stroke-width="1"/>
<path d="M120 6v10" stroke="#8C867B" stroke-width="1"/>
<path d="M150 6v5" stroke="#8C867B" stroke-width="1"/>
<path d="M180 6v5" stroke="#8C867B" stroke-width="1"/>
<path d="M210 6v5" stroke="#8C867B" stroke-width="1"/>
<path d="M240 6v10" stroke="#8C867B" stroke-width="1"/>
<path d="M270 6v5" stroke="#8C867B" stroke-width="1"/>
<path d="M300 6v5" stroke="#8C867B" stroke-width="1"/>
<path d="M330 6v5" stroke="#8C867B" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="24" y="34" fill="#1F2328" font-size="14" font-weight="800" letter-spacing="0.8">ONE RECORDED TRACE</text>
    <text x="24" y="58" fill="#59636E" font-size="10">00:00—00:05 / REPRODUCIBLE</text>
    <path d="M76 120V550" stroke="#8C867B" stroke-width="2"/>
    <circle class="signal-pulse" cx="76" cy="120" r="4" fill="#116329"/>
    <g>
        <text x="24" y="124" fill="#59636E" font-size="10">00:00</text>
        <circle cx="76" cy="120" r="7" fill="#FCFBF7" stroke="#8C867B" stroke-width="2"/>
        <text x="105" y="117" fill="#8C867B" font-size="14" font-weight="800" letter-spacing="0.5">INPUT</text>
        <text x="105" y="141" fill="#1F2328" font-size="12">ambiguous behavior</text>
      </g>
<g>
        <text x="24" y="210" fill="#59636E" font-size="10">00:01</text>
        <circle cx="76" cy="206" r="7" fill="#DDF3E4" stroke="#116329" stroke-width="2"/>
        <text x="105" y="203" fill="#116329" font-size="14" font-weight="800" letter-spacing="0.5">OBSERVE</text>
        <text x="105" y="227" fill="#1F2328" font-size="12">import the trace</text>
      </g>
<g>
        <text x="24" y="296" fill="#59636E" font-size="10">00:02</text>
        <circle cx="76" cy="292" r="7" fill="#DDF3E4" stroke="#116329" stroke-width="2"/>
        <text x="105" y="289" fill="#116329" font-size="14" font-weight="800" letter-spacing="0.5">VERIFY</text>
        <text x="105" y="313" fill="#1F2328" font-size="12">schema · budget · safety</text>
      </g>
<g>
        <text x="24" y="382" fill="#59636E" font-size="10">00:03</text>
        <circle cx="76" cy="378" r="7" fill="#DDF3E4" stroke="#116329" stroke-width="2"/>
        <text x="105" y="375" fill="#116329" font-size="14" font-weight="800" letter-spacing="0.5">COMPARE</text>
        <text x="105" y="399" fill="#1F2328" font-size="12">candidate ↔ baseline</text>
      </g>
<g>
        <text x="24" y="468" fill="#59636E" font-size="10">00:04</text>
        <circle cx="76" cy="464" r="7" fill="#FDE8C4" stroke="#9A4D00" stroke-width="2"/>
        <text x="105" y="461" fill="#9A4D00" font-size="14" font-weight="800" letter-spacing="0.5">DECISION</text>
        <text x="105" y="485" fill="#1F2328" font-size="12">regression blocked</text>
      </g>
<g>
        <text x="24" y="554" fill="#59636E" font-size="10">00:05</text>
        <circle cx="76" cy="550" r="7" fill="#DDF3E4" stroke="#116329" stroke-width="2"/>
        <text x="105" y="547" fill="#116329" font-size="14" font-weight="800" letter-spacing="0.5">ARTIFACT</text>
        <text x="105" y="571" fill="#1F2328" font-size="12">reproducible report</text>
      </g>
    <path class="policy-gate" d="M84 464H336" stroke="#9A4D00" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="336" y="452" fill="#9A4D00" font-size="10" font-weight="700" text-anchor="end">POLICY GATE FIRED</text>
    <path d="M24 586H336" stroke="#8C867B" stroke-dasharray="3 5"/>
    <text x="24" y="615" fill="#59636E" font-size="10">EVIDENCE ATTACHED / REPRODUCIBLE</text>
  </g>
</svg>
